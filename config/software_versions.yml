#
# Pinned versions and checksums for bundled third-party components.
#
# This file is the single source of truth for the upstream version and the
# sha256 of the source tarball (and, where applicable, the pre-built UBT
# bundle) of components fetched from upstream by `config/software/*.rb`.
#
# Software definitions read these values through `Gitlab::Version`
# (see lib/gitlab/version.rb), so a version bump is a data-only change here
# rather than an edit to Ruby build logic.
#
# Update it with:
#
#     bundle exec rake "software_versions:update[ruby,3.4.10]"
#     bundle exec rake software_versions:verify
#
# NOTE: `rake software_versions:update` rewrites the data below `---`, so keep
# all commentary in this header block; comments placed among the data are not
# preserved. Values are always read as strings (Gitlab::Version disables YAML
# type coercion), so versions need not be quoted and "1.20" is never read as
# the float 1.2.
#
# Keys per component:
#   version   - the single pinned upstream version (simple components)
#   sha256    - sha256 of the source tarball for `version`
#   checksums - map of version => sha256, for components that must keep
#               several versions selectable (e.g. ruby current/next)
#   current   - selected version for stable/tag builds (ruby)
#   next      - version being rolled out on regular branches (ruby)
#   env_var   - environment variable that overrides `version` for ad-hoc builds
#   ubt       - pre-built GitLab toolchain (UBT) bundle. Its `revision` is the
#               UBT rebuild suffix; the bundle version is derived as
#               "<version>-<revision>", so it stays coupled to `version`.
#
# Follow the Ruby upgrade guide when changing the ruby current/next versions:
# https://docs.gitlab.com/ee/development/ruby_upgrade.html
#
